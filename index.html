<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adem Gaming — Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-red: #ff3b3b;
      --neon-cyan: #00d2ff;
      --bg-dark: #0d0d0f;
      --bg-card: rgba(18, 18, 22, 0.9);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg-dark);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,59,59,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,210,255,0.04) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      animation: floatUp linear infinite;
      opacity: 0;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    .profile-section {
      text-align: center;
      margin-bottom: 2.5rem;
      z-index: 10;
      animation: fadeInDown 1s ease-out;
    }

    .logo-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(var(--neon-red), var(--neon-cyan), var(--neon-red));
      animation: spin 4s linear infinite;
      filter: blur(3px);
      opacity: 0.8;
    }

    .logo-wrapper::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(var(--neon-red), var(--neon-cyan), var(--neon-red));
      animation: spin 4s linear infinite;
      filter: blur(12px);
      opacity: 0.4;
    }

    .logo-img {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,59,59,0.3);
      position: relative;
      z-index: 1;
      background: #0d0d0f;
      box-shadow: 0 0 30px rgba(255,59,59,0.2), inset 0 0 30px rgba(0,0,0,0.5);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .gamer-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--neon-red);
      text-shadow: 0 0 10px rgba(255,59,59,0.6), 0 0 30px rgba(255,59,59,0.3);
      letter-spacing: 3px;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      color: var(--neon-cyan);
      font-size: 1rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0,210,255,0.4);
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      width: 100%;
      max-width: 1000px;
      z-index: 10;
      perspective: 1000px;
    }

    .link-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 1.5rem;
      text-decoration: none;
      color: white;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      backdrop-filter: blur(10px);
      overflow: hidden;
      animation: fadeInUp 0.8s ease-out backwards;
    }

    .link-card:nth-child(1) { animation-delay: 0.2s; --card-color: #E1306C; }
    .link-card:nth-child(2) { animation-delay: 0.35s; --card-color: #FF0000; }
    .link-card:nth-child(3) { animation-delay: 0.5s; --card-color: #5865F2; }
    .link-card:nth-child(4) { animation-delay: 0.65s; --card-color: #9146FF; }
    .link-card:nth-child(5) { animation-delay: 0.8s; --card-color: #00f2ea; }

    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--card-color), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
      border-radius: 16px;
    }

    .link-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, var(--card-color), transparent 30%);
      animation: rotate 4s linear infinite;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .link-card:hover {
      transform: translateY(-8px) rotateX(5deg) scale(1.02);
      border-color: var(--card-color);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 30px var(--card-color);
    }

    .link-card:hover::before { opacity: 0.15; }
    .link-card:hover::after { opacity: 0.1; }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    .card-icon svg {
      width: 26px;
      height: 26px;
      transition: all 0.3s ease;
    }

    .link-card:hover .card-icon {
      background: var(--card-color);
      border-color: var(--card-color);
      box-shadow: 0 0 20px var(--card-color);
      transform: scale(1.1) rotate(-5deg);
    }

    .card-content {
      position: relative;
      z-index: 1;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      letter-spacing: 1px;
    }

    .card-handle {
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .card-arrow {
      margin-left: auto;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.3);
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .link-card:hover .card-arrow {
      color: var(--card-color);
      transform: translateX(5px);
      text-shadow: 0 0 10px var(--card-color);
    }

    .link-card:hover .card-title {
      animation: glitch 0.3s ease;
    }

    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(2px, -2px); }
      60% { transform: translate(-2px, -2px); }
      80% { transform: translate(2px, 2px); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 5;
    }

    .footer-glow {
      margin-top: 2rem;
      z-index: 10;
      color: rgba(255,255,255,0.3);
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    @media (max-width: 600px) {
      .gamer-tag { font-size: 1.6rem; }
      .cards-container { grid-template-columns: 1fr; }
      .logo-wrapper { width: 140px; height: 140px; }
      .logo-img { width: 130px; height: 130px; }
    }
  </style>
</head>

  <div class="footer-glow">Connect · Play · Dominate</div>

  <script>
    const particlesContainer = document.getElementById('particles');
    const colors = ['#ff3b3b', '#00d2ff', '#ff6b6b', '#4ecdc4'];

    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (Math.random() * 8 + 5) + 's';
      particle.style.animationDelay = Math.random() * 10 + 's';
      const color = colors[Math.floor(Math.random() * colors.length)];
      particle.style.background = color;
      particle.style.boxShadow = '0 0 10px ' + color + ', 0 0 20px ' + color;
      particlesContainer.appendChild(particle);
    }

    document.querySelectorAll('.link-card').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = (y - centerY) / 10;
        const rotateY = (centerX - x) / 10;
        card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) translateY(-8px) scale(1.02)';
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateY(0) scale(1)';
      });
    });
  </script>
